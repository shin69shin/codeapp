name: Build CodeApp IPA

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Required Frameworks
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Build Raw Target (Bypass Missing Schemes)
        run: |
          # Try the CodeApp target first. If it fails, fallback to CodeUI. If that fails, build all targets.
          xcodebuild build \
            -project Code.xcodeproj \
            -target CodeApp \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=$PWD/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="com.thebaselab.codeapp" || \
          xcodebuild build \
            -project Code.xcodeproj \
            -target CodeUI \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=$PWD/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="com.thebaselab.codeapp" || \
          xcodebuild build \
            -project Code.xcodeproj \
            -alltargets \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=$PWD/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="com.thebaselab.codeapp"

      - name: Generate Unsigned IPA
        run: |
          mkdir -p Payload
          # We force Xcode to output to our local 'build' folder, making the .app easy to grab
          find build -name "*.app" -type d -exec cp -r {} Payload/ \;
          zip -r CodeApp.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: CodeApp.ipa
