name: Build CodeApp IPA

on:
  workflow_dispatch: # Allows you to trigger the build manually with a button click

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Install Dependencies
        run: |
          # If the project uses CocoaPods or Swift Package Manager dependencies, 
          # resolve them here (e.g., pod install if a Podfile exists)
          echo "Resolving packages..."

      - name: Build and Archive Project
        run: |
          xcodebuild archive \
            -project CodeApp.xcodeproj \
            -scheme CodeApp \
            -configuration Release \
            -archivePath $PWD/build/CodeApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Generate Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/CodeApp.xcarchive/Products/Applications/CodeApp.app Payload/
          zip -r CodeApp.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: CodeApp.ipa
