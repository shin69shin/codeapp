name: Build CodeApp IPA

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Required Frameworks
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Build CodeApp Binary (Auto-Detect Scheme)
        run: |
          # Automatically parse the project file to find the first valid build scheme
          SELECT_SCHEME=$(xcodebuild -list -project Code.xcodeproj | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | sed 's/^[[:space:]]*//' | head -n 1)
          echo "Discovered active scheme: '$SELECT_SCHEME'"
          
          xcodebuild build \
            -project Code.xcodeproj \
            -scheme "$SELECT_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Generate Unsigned IPA
        run: |
          mkdir -p Payload
          # Locate the freshly built .app folder from the Xcode build directory and copy it
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -exec cp -r {} Payload/ \;
          zip -r CodeApp.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: CodeApp.ipa
