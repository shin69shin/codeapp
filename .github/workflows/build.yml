name: Build CodeApp IPA

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Required Frameworks
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Build Main App Only (Optimized)
        run: |
          xcodebuild build \
            -project Code.xcodeproj \
            -target Code \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=$PWD/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SKIP_INSTALL=NO \
            BUILD_LIBRARIES_FOR_DISTRIBUTION=YES \
            -jobs 1


      - name: Generate Unsigned IPA
        run: |
          mkdir -p Payload
          # We force Xcode to output to our local 'build' folder, making the .app easy to grab
          find build -name "*.app" -type d -exec cp -r {} Payload/ \;
          zip -r CodeApp.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: CodeApp.ipa
